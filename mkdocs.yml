      - Callbacks: guide/callbacks.md
      - Ask and tell: guide/ask-tell.md
      - Benchmarks: guide/benchmarks.md
      - Test problems: guide/test-problems.md
      - Multi-objective benchmarks: guide/multi-objective-problems.md
      - Experiments and statistics: guide/experiments.md
      - Native operators: guide/operators.md
      - Tuning: tuning.md
  - Algorithms:
