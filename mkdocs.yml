site_name: YPEA for Python
site_description: "Yarpiz Evolutionary Algorithms: define an optimization problem once, solve it with any metaheuristic."
site_author: Mostapha Kalami Heris
site_url: https://smkalami.github.io/ypea-python/
repo_url: https://github.com/smkalami/ypea-python
repo_name: smkalami/ypea-python
copyright: Copyright 2026 Mostapha Kalami Heris, MIT license

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.highlight
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      toggle:
        icon: material/brightness-7
        name: Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      toggle:
        icon: material/brightness-4
        name: Light mode

# links to missing headings fail the strict build too
validation:
  anchors: warn

# the griffe extension that turns the plain text docstrings into Markdown
exclude_docs: |
  hooks/
  /figures/

markdown_extensions:
  - admonition
  - tables
  - toc:
      permalink: true
  - attr_list
  - md_in_html
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            docstring_style: null
            extensions:
              - docs/hooks/docstrings.py:LooseNumpyDocstrings
            show_root_heading: true
            show_root_full_path: false
            show_source: false
            show_bases: false
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: false
            members_order: source
            filters: ["!^_"]
            heading_level: 2
            members: false

