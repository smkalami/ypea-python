[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ypea"
dynamic = ["version"]
description = "Yarpiz Evolutionary Algorithms: define an optimization problem once, solve it with any metaheuristic."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mostapha Kalami Heris" }]
requires-python = ">=3.12"
dependencies = ["numpy>=2.0"]
keywords = ["optimization", "metaheuristics", "evolutionary algorithms", "swarm intelligence"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.8"]
stats = ["scipy>=1.12"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Source = "https://github.com/smkalami/ypea-python"
"MATLAB version" = "https://github.com/smkalami/ypea"

[tool.hatch.version]
path = "src/ypea/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/ypea"]

[tool.hatch.build.targets.sdist]
include = ["src/ypea", "tests", "README.md", "LICENSE", "CITATION.cff"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: long benchmark style tests, skipped locally, run in CI"]
addopts = "-m 'not slow'"

[tool.ruff]
line-length = 120
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY"]
